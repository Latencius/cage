name: Release Desktop Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: npm ci

      - name: Build and publish Cage Desktop
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Cage v__VERSION__"
          releaseBody: |
            ### Cage v__VERSION__ — Transparent Glass Cage for Local AI Agents

            - **Custom Liquid Glass Icon & UI**: Translucent macOS/Windows desktop client built with Tauri v2 (~5 MiB installer)
            - **Zero-Config Local LLM Discovery**: Auto-detects Ollama, LM Studio, llama.cpp, and vLLM
            - **Rust Physical Security Boundary**: Path traversal/symlink protection + single-use, argument-bound human approval tokens
            - **MCP (stdio & Streamable HTTP) Integration**: Connect external MCP servers protected by Cage's Approval Gate
            - **OpenClaw Gateway (WebSocket v4)**: Connect to `ws://127.0.0.1:18789` and intercept `exec.approval` requests
            - **Isolated Cloud VM Mode**: One-toggle E2B Desktop noVNC sandbox with Human Takeover
            - **Multilingual (EN default / 日本語 / 简体中文)** & GitHub Star popup card

            Download the installer for macOS (Apple Silicon / Intel) or Windows below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
